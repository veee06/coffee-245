<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bean &amp; Brew — Coffee Shop Management System</title>
<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#2a1d14;--mut:#7a6b5f;--br:#4a2e20;--br2:#6b4a37;--tan:#e8d5b5;--line:#eadfce;--ok:#2f6b3f;--bad:#b4432b;--badbg:#fbeee8;--okbg:#e4f1e4;--warn:#f3e3b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1410;--card:#261c16;--ink:#f3e9dc;--mut:#b3a290;--br:#120d0a;--br2:#3a291f;--tan:#5b4430;--line:#3a2d24;--ok:#8fd19e;--bad:#ef9a85;--badbg:#3a211b;--okbg:#1f3323;--warn:#4a3d1b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1410;--card:#261c16;--ink:#f3e9dc;--mut:#b3a290;--br:#120d0a;--br2:#3a291f;--tan:#5b4430;--line:#3a2d24;--ok:#8fd19e;--bad:#ef9a85;--badbg:#3a211b;--okbg:#1f3323;--warn:#4a3d1b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--br);color:#f3e9dc;flex-wrap:wrap}
.top b{letter-spacing:.5px}.roles{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:99px}
.roles button{padding:7px 18px;border-radius:99px;color:#e8d5b5}.roles button.on{background:var(--tan);color:#2a1d14;font-weight:600}
.app{display:flex;min-height:calc(100vh - 56px)}
.side{width:220px;flex:none;background:var(--br);color:#e8d5b5;padding:24px 14px;display:flex;flex-direction:column;gap:6px}
.side h1{margin:0;font-size:20px;color:#fff;padding:0 10px}.side small{padding:0 10px;font-size:10px;letter-spacing:1px}
.side hr{border:0;border-top:1px solid rgba(255,255,255,.2);margin:16px 0}.side .lbl{padding:0 10px;font-size:11px;letter-spacing:1px;font-weight:600;margin-bottom:4px}
.side button{text-align:left;padding:11px 12px;border-radius:10px;color:#e8d5b5}.side button.on{background:var(--br2);color:#fff;font-weight:600}
.side .on-d{margin-top:auto;padding:0 10px;font-size:12px}.main{flex:1;padding:28px;min-width:0}
.hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:20px}.hd h2{margin:0;font-size:26px}.hd p{margin:4px 0 0;color:var(--mut)}
.usr{display:flex;gap:10px;align-items:center;text-align:right;font-size:12px;color:var(--mut)}.usr b{display:block;color:var(--ink);font-size:14px}
.av{width:42px;height:42px;border-radius:50%;background:var(--tan);display:grid;place-items:center;font-weight:700;color:#2a1d14}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.card h3{margin:0 0 2px;font-size:18px}.sub{color:var(--mut);font-size:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:16px}
.stat .v{font-size:26px;font-weight:700;margin:6px 0}.up{color:var(--ok);font-size:12px}.dn{color:var(--bad);font-size:12px}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.split{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.bars{display:flex;align-items:flex-end;gap:12px;height:190px;margin-top:20px;border-bottom:1px solid var(--line)}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}.bars i{display:block;width:70%;background:var(--tan);border-radius:10px 10px 4px 4px}.bars .hi i{background:var(--br2)}
.days{display:flex;gap:12px;margin-top:6px;color:var(--mut);font-size:12px}.days span{flex:1;text-align:center}
.li{display:flex;align-items:center;gap:12px;padding:9px 0}.ic{width:38px;height:38px;border-radius:50%;background:var(--tan);display:grid;place-items:center;font-size:18px;flex:none}
.alert{background:var(--badbg);border-color:#efcfc3}.alert .li{color:var(--bad);justify-content:space-between;padding:6px 0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px}th{font-size:12px;color:var(--mut);text-align:left;font-weight:500;padding:8px 6px}td{padding:11px 6px;border-top:1px solid var(--line)}
tr.sel td{background:var(--bg)}tr[onclick]{cursor:pointer}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--tan);color:#2a1d14}.p-New{background:var(--warn)}.p-Ready,.p-Paid{background:var(--okbg);color:var(--ok)}.p-Completed{background:var(--line);color:var(--mut)}.p-Preparing{background:#f6dcc0;color:#7a3f12}
.btn{background:var(--br2);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;width:100%}.btn.ghost{background:var(--tan);color:#2a1d14;width:auto;padding:8px 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{padding:7px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line)}.chip.on{background:var(--br2);color:#fff;border-color:var(--br2)}
input{font:inherit;width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.mi{text-align:center}.mi .ic{width:56px;height:56px;font-size:26px;margin:0 auto 8px}
.add{background:var(--tan);color:#2a1d14;border-radius:10px;padding:6px 12px;margin-top:8px;font-weight:600}
.sm{display:flex;justify-content:space-between;padding:4px 0}.sm.t{font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.pay{display:flex;gap:8px;margin:10px 0 14px}.pay button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card)}.pay .on{background:var(--tan);border-color:var(--br2);color:#2a1d14;font-weight:600}
.qty{display:flex;gap:10px;align-items:center}.qty button{width:28px;height:28px;border-radius:50%;background:var(--tan);color:#2a1d14;font-weight:700}
/* customer phone */
.stage{display:flex;justify-content:center;padding:24px 12px}.phone{width:100%;max-width:390px;min-height:760px;background:var(--bg);border:1px solid var(--line);border-radius:32px;box-shadow:0 12px 40px rgba(0,0,0,.15);display:flex;flex-direction:column;overflow:hidden}
.sb{display:flex;justify-content:space-between;padding:12px 24px 0;font-size:12px;font-weight:600}.pg{flex:1;padding:18px 20px;overflow-y:auto}.pg h2{margin:0;font-size:24px}.pg>p{margin:2px 0 14px;color:var(--mut)}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card)}.nav button{flex:1;padding:10px 0;font-size:11px;color:var(--mut)}.nav button.on{color:var(--br2);font-weight:700}.nav span{display:block;font-size:18px}
.hero{background:var(--br2);color:#fff;border-radius:20px;padding:20px;margin:14px 0}.hero small{letter-spacing:1px;color:var(--tan)}.hero h3{font-size:22px;margin:6px 0 12px;color:#fff}.hero button{background:var(--tan);color:#2a1d14;border-radius:99px;padding:8px 16px;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:12px}.cats .ic{margin:0 auto 4px;width:52px;height:52px;font-size:24px}
.sec{display:flex;justify-content:space-between;margin:18px 0 8px;font-weight:700}.sec a{font-weight:400;color:var(--mut);font-size:12px;cursor:pointer}
.mrow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.mrow .ic{width:52px;height:52px;border-radius:14px}.mrow>div:nth-child(2){flex:1}
.plus{width:32px;height:32px;border-radius:50%;background:var(--br2);color:#fff;font-size:18px}
.track{background:var(--br2);color:#fff;border-radius:20px;padding:20px;margin-bottom:18px}.step{display:flex;gap:14px;padding:0 0 18px;position:relative}.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);flex:none;background:var(--card);font-size:12px}.step.d .dot{background:var(--ok);border-color:var(--ok);color:#fff}.step.c .dot{border-color:var(--br2);color:var(--br2)}
.menuitem{display:flex;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line)}
.fab{position:relative;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--br);color:#fff;padding:10px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9}#toast.s{opacity:1}
@media(max-width:860px){.app{flex-direction:column}.side{width:auto;flex-direction:row;flex-wrap:wrap;padding:10px;align-items:center}.side h1,.side small,.side hr,.side .lbl,.side .on-d{display:none}.main{padding:16px}.row2,.split{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><b>☕ BEAN &amp; BREW — Coffee Shop Management System</b>
<div class="roles" id="roles"></div></div>
<div id="root"></div><div id="toast"></div>
<script>
const M=[{n:'Cappuccino',e:'☕',p:28000,d:'Espresso, milk foam',c:'Coffee'},{n:'Americano',e:'🖤',p:22000,d:'Bold & balanced',c:'Coffee'},{n:'Iced Aren Latte',e:'🥤',p:25000,d:'Palm sugar & milk',c:'Coffee'},{n:'Caramel Macchiato',e:'🍯',p:32000,d:'Sweet layered coffee',c:'Coffee'},{n:'Caramel Latte',e:'🥛',p:30000,d:'Creamy caramel latte',c:'Coffee'},{n:'Matcha Latte',e:'🍵',p:29000,d:'Earthy & smooth',c:'Non Coffee'},{n:'Butter Croissant',e:'🥐',p:18000,d:'Flaky & buttery',c:'Food'}];
const P=n=>M.find(m=>m.n==n),R=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const S={role:'customer',cp:'home',kp:'pos',mp:'overview',cart:{'Iced Aren Latte':1,'Cappuccino':1},pos:{'Iced Aren Latte':1,'Cappuccino':1,'Butter Croissant':1},cpay:'QRIS',ppay:'QRIS',mcat:'All',q:'',of:'All',osel:'0248',tsel:'0247',done:0};
const ORD=[['0252','Nadia','Table 08','Dine in',2,51700,'New','10:42'],['0251','Rizky','Pickup · R51','Takeaway',2,48400,'New','10:39'],['0250','Dewi','Table 02','Dine in',2,63800,'Preparing','10:36'],['0249','Andi','Pickup · A49','Takeaway',1,33000,'Ready','10:33'],['0248','Sarah','Table 04','Dine in',3,78100,'Preparing','10:28'],['0247','Bima','Table 06','Dine in',3,81400,'Completed','10:21'],['0246','Maya','Pickup · M46','Takeaway',2,63800,'Completed','10:15']];
const TX=[['0247','10:24',81400,'QRIS'],['0246','10:18',63800,'Debit'],['0245','10:11',48400,'Cash'],['0244','09:58',55000,'QRIS'],['0243','09:45',78100,'Cash'],['0242','09:32',31900,'QRIS'],['0241','09:16',24200,'Debit']];
const sum=o=>Object.entries(o).reduce((a,[n,q])=>a+P(n).p*q,0);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.className='s';setTimeout(()=>e.className='',1800)}
function set(k,v){S[k]=v;render()}
function chg(o,n,d){S[o][n]=(S[o][n]||0)+d;if(S[o][n]<=0)delete S[o][n];render()}
function sums(o){const s=sum(S[o]),t=s*.1;return `<div class="sm"><span>Subtotal</span><span>${R(s)}</span></div><div class="sm"><span>Tax &amp; service (10%)</span><span>${R(t)}</span></div><div class="sm t"><span>Total</span><span>${R(s+t)}</span></div>`}
function pays(k,key){return `<div class="pay">${['QRIS','Cash','Debit'].map(x=>`<button class="${S[key]==x?'on':''}" onclick="set('${key}','${x}')">${x}</button>`).join('')}</div>`}
const hd=(t,s)=>`<div class="hd"><div><h2>${t}</h2><p>${s}</p></div><div class="usr"><div><b>Admin</b>Staff account</div><div class="av">A</div></div></div>`;
function side(role,items,cur,fn,label){return `<aside class="side"><h1>BEAN &amp; BREW</h1><small>COFFEE HOUSE</small><hr><div class="lbl">${label}</div>${items.map(([k,l])=>`<button class="${cur==k?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}<div class="on-d">● Online</div></aside>`}
/* CUSTOMER */
function mrow(m){return `<div class="mrow"><div class="ic">${m.e}</div><div><b>${m.n}</b><div class="sub">${m.d}</div><b>${R(m.p)}</b></div><button class="plus" onclick="chg('cart','${m.n}',1);toast('${m.n} ditambahkan')">+</button></div>`}
function customer(){const p=S.cp,cnt=Object.values(S.cart).reduce((a,b)=>a+b,0);let h='';
if(p=='home')h=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Good morning, Juve ☀</h2><div class="av">J</div></div><p>Find your coffee</p><input placeholder="⌕ Search coffee, tea, pastry..." onfocus="set('cp','menu')"><div class="hero"><small>WEEKEND SPECIAL</small><h3>A little coffee,<br>a lot of comfort.</h3><button onclick="set('cp','menu')">Order now →</button></div><div class="sec">Categories<a onclick="set('cp','menu')">See all</a></div><div class="cats">${[['☕','Coffee'],['🥛','Non Coffee'],['🥐','Pastry'],['🍰','Dessert']].map(c=>`<div onclick="set('mcat','${c[1]=='Pastry'?'Food':c[1]}');set('cp','menu')"><div class="ic">${c[0]}</div>${c[1]}</div>`).join('')}</div><div class="sec">Popular right now<a onclick="set('cp','menu')">View menu</a></div>${mrow(M[0])}${mrow(M[2])}`;
if(p=='menu'){const L=M.filter(m=>(S.mcat=='All'||m.c==S.mcat)&&m.n.toLowerCase().includes(S.q.toLowerCase()));h=`<h2>Our Menu</h2><p>Made fresh, served with love.</p><input id="q" placeholder="⌕ Search your favorite" value="${S.q}" oninput="S.q=this.value;render(1)"><div class="chips">${['All','Coffee','Non Coffee','Food'].map(c=>`<button class="chip ${S.mcat==c?'on':''}" onclick="set('mcat','${c}')">${c}</button>`).join('')}</div>${L.map(mrow).join('')||'<p class="sub">Menu tidak ditemukan.</p>'}`}
if(p=='cart'){const e=Object.entries(S.cart);h=`<h2>Your Cart</h2><p>Almost there — enjoy your coffee!</p>${e.map(([n,q])=>`<div class="mrow"><div class="ic">${P(n).e}</div><div><b>${n}</b><div class="sub">Regular</div><b>${R(P(n).p)}</b></div><div class="qty"><button onclick="chg('cart','${n}',-1)">−</button>${q}<button onclick="chg('cart','${n}',1)">+</button></div></div>`).join('')||'<p class="sub">Keranjang kosong.</p>'}<b>Order note</b><input placeholder="Anything we should know? (optional)" style="margin:6px 0 14px"><b>Payment method</b>${pays('c','cpay')}<b>Payment summary</b>${sums('cart')}<button class="btn" style="margin-top:14px" onclick="if(!cnt()){toast('Keranjang kosong');return}S.cart={};toast('Pesanan dibuat!');set('cp','track')">Place order →</button>`}
if(p=='track')h=`<h2>Track your order</h2><p>We’ll let you know when it’s ready.</p><div class="track"><small>ORDER #CF-0248</small><h3 style="margin:6px 0">Your coffee is brewing! ☕</h3>Estimated pickup: 10:25 AM</div><b>Order progress</b><div style="margin-top:14px">${[['d','✓','Order received','10:05 AM'],['d','✓','Being prepared','10:12 AM'],['c','●','Ready for pickup','Estimated 10:25'],['','○','Completed','']].map(s=>`<div class="step ${s[0]}"><div class="dot">${s[1]}</div><div><b>${s[2]}</b><div class="sub">${s[3]}</div></div></div>`).join('')}</div><div class="sub">Show your order number at the counter.</div>`;
if(p=='profile')h=`<h2>My profile</h2><p>Your coffee, your way.</p><div class="card" style="display:flex;gap:14px;align-items:center"><div class="av">J</div><div style="flex:1"><b>Juve</b><div class="sub">juve@gmail.com</div><div class="sub">+62 812-3456-7890</div></div><button class="btn ghost">Edit profile</button></div><div class="sec">Account</div>${['Order history','Favorite orders','Payment methods','Privacy & security'].map(x=>`<div class="menuitem">${x}<span>›</span></div>`).join('')}<div class="sec">Settings &amp; support</div><div class="menuitem">Notifications<span>›</span></div><div class="menuitem">Language<span class="sub">English</span></div><div class="menuitem">Help center<span>›</span></div><button class="btn" style="background:var(--badbg);color:var(--bad);margin:18px 0 8px">Log out</button><div class="sub" style="text-align:center">Version 1.0.0</div>`;
const nav=[['home','⌂','Home'],['menu','▦','Menu'],['track','▣','Pesanan'],['profile','○','Profil']];
return `<div class="stage"><div class="phone"><div class="sb"><span>9:41</span><button class="fab" onclick="set('cp','cart')">🛒 ${cnt}</button></div><div class="pg">${h}</div><div class="nav">${nav.map(n=>`<button class="${S.cp==n[0]?'on':''}" onclick="set('cp','${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</div></div></div>`}
function cnt(){return Object.keys(S.cart).length}
/* KASIR */
function kasir(){const p=S.kp;let h='';
if(p=='pos'){const L=M.filter(m=>(S.mcat=='All'||m.c==S.mcat)&&m.n.toLowerCase().includes(S.q.toLowerCase()));const e=Object.entries(S.pos),t=sum(S.pos)*1.1;
h=hd('Point of Sale','Create orders, process payments, and manage customer pickup.')+`<div class="split"><div><input id="q" placeholder="⌕ Search menu or scan item..." value="${S.q}" oninput="S.q=this.value;render(1)"><div class="chips">${['All','Coffee','Non Coffee','Food'].map(c=>`<button class="chip ${S.mcat==c?'on':''}" onclick="set('mcat','${c}')">${c=='All'?'All items':c}</button>`).join('')}</div><div class="menu">${L.map(m=>`<div class="card mi"><div class="ic">${m.e}</div><b>${m.n}</b><div class="sub">${R(m.p)}</div><button class="add" onclick="chg('pos','${m.n}',1)">+ Add</button></div>`).join('')}</div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><h3>Current order</h3><span class="pill">Dine in</span></div><div class="sub">ORDER #0248 · Table 04</div>${e.map(([n,q])=>`<div class="li"><div style="flex:1"><b>${n}</b></div><div class="qty"><button onclick="chg('pos','${n}',-1)">−</button>${q}<button onclick="chg('pos','${n}',1)">+</button></div><b style="min-width:80px;text-align:right">${R(P(n).p*q)}</b></div>`).join('')||'<p class="sub">Belum ada item.</p>'}<div class="sub" style="margin:6px 0 10px">＋ Add order note</div>${sums('pos')}<b>Payment method</b>${pays('p','ppay')}<button class="btn" onclick="if(!Object.keys(S.pos).length){toast('Order kosong');return}toast('Pembayaran ${S.ppay} berhasil');S.pos={};render()">Charge · ${R(t)}</button></div></div>`}
if(p=='orders'){const f=S.of,L=ORD.filter(o=>f=='All'||o[6]==f),o=ORD.find(x=>x[0]==S.osel)||ORD[4],st=o[5]/1.1,cn=s=>ORD.filter(x=>x[6]==s).length;
h=hd('Orders','Track orders, manage preparation, and keep every pickup on time.')+`<div class="grid4">${[['Today’s orders',12,'3 new orders to confirm'],['Preparing',4,'Currently in the kitchen'],['Ready to serve',2,'Waiting for pickup or service'],['Completed',3,'Served and paid today']].map(s=>`<div class="card stat"><div class="sub">${s[0]}</div><div class="v">${s[1]}</div><div class="sub">${s[2]}</div></div>`).join('')}</div><div class="split"><div class="card"><div class="chips" style="margin-top:0">${['All','New','Preparing','Ready','Completed'].map(c=>`<button class="chip ${f==c?'on':''}" onclick="set('of','${c}')">${c}${c=='All'?'':' '+cn(c)}</button>`).join('')}</div><div class="tw"><table><tr><th>Order</th><th>Customer / Table</th><th>Service</th><th>Items</th><th>Total</th><th>Status</th></tr>${L.map(x=>`<tr class="${x[0]==S.osel?'sel':''}" onclick="set('osel','${x[0]}')"><td><b>#${x[0]}</b><div class="sub">${x[7]} AM</div></td><td>${x[1]}<div class="sub">${x[2]}</div></td><td>${x[3]}</td><td>${x[4]}</td><td>${R(x[5])}</td><td><span class="pill p-${x[6]}">${x[6]}</span></td></tr>`).join('')}</table></div></div><div class="card"><div style="display:flex;justify-content:space-between"><h3>Order #${o[0]}</h3><span class="pill p-${o[6]}">${o[6]}</span></div><div class="sub">24 Oct 2026 · ${o[7]} AM</div><div class="li"><b>${o[1]} · ${o[2]}</b><span class="pill" style="margin-left:auto">${o[3]}</span></div><div class="sm"><span>Items</span><span>${o[4]} items</span></div><div class="sm"><span>Subtotal</span><span>${R(st)}</span></div><div class="sm"><span>Tax &amp; service (10%)</span><span>${R(o[5]-st)}</span></div><div class="sm t"><span>Total payment</span><span>${R(o[5])}</span></div><div class="sm"><span>Payment status</span><span>${o[6]=='Completed'?'Paid':'Unpaid'}</span></div></div></div>`}
if(p=='tx'){const x=TX.find(a=>a[0]==S.tsel)||TX[0],s=x[2]/1.1;
h=hd('Transactions','Review payments, track daily sales, and manage transaction records.')+`<div class="grid4">${[['Total payments','Rp 382.800','Today · 24 Oct 2026'],['Successful transactions','7','Cash, QRIS, and Debit'],['Refunds','Rp 19.800','1 transaction refunded'],['Net sales','Rp 363.000','Total payments less refunds']].map(s=>`<div class="card stat"><div class="sub">${s[0]}</div><div class="v">${s[1]}</div><div class="sub">${s[2]}</div></div>`).join('')}</div><div class="split"><div class="card"><div style="display:flex;justify-content:space-between"><h3>Transaction history</h3><button class="btn ghost" onclick="toast('Export dimulai')">Export</button></div><div class="tw"><table><tr><th>Transaction</th><th>Time</th><th>Amount</th><th>Method</th><th>Status</th></tr>${TX.map(t=>`<tr class="${t[0]==S.tsel?'sel':''}" onclick="set('tsel','${t[0]}')"><td><b>TX-${t[0]}</b><div class="sub">Order #${t[0]}</div></td><td>${t[1]} AM</td><td>${R(t[2])}</td><td>${t[3]}</td><td><span class="pill p-Paid">Paid</span></td></tr>`).join('')}</table></div></div><div class="card"><div style="display:flex;justify-content:space-between"><h3>Transaction details</h3><span class="pill p-Paid">Paid</span></div><div class="sub">TX-${x[0]} · Order #${x[0]}</div><div class="v" style="font-size:26px;font-weight:700;margin:10px 0 2px">${R(x[2])}</div><div class="sub">Payment received · ${x[3]}</div><div class="sm"><span>Paid at</span><span>24 Oct 2026 · ${x[1]} AM</span></div><div class="sm"><span>Cashier</span><span>Admin</span></div><div class="sm"><span>Reference</span><span>${x[3]}-261024-${x[0]}</span></div><div class="sm"><span>Subtotal</span><span>${R(s)}</span></div><div class="sm"><span>Tax &amp; service (10%)</span><span>${R(x[2]-s)}</span></div></div></div>`}
return `<div class="app">${side('k',[['pos','▦ Point of Sale'],['orders','▣ Orders'],['tx','◷ Transactions']],p,'kgo','CASHIER')}<main class="main">${h}</main></div>`}
function kgo(k){S.kp=k;S.q='';S.mcat='All';render()}

const h=hd('Dashboard overview','Monitor store performance, sales, inventory, and team activity.')+`<div class="grid4">${[['Total revenue','Rp 8.450.000','+12.8% this month','up'],['Transactions','284','+8.2% this month','up'],['Average order','Rp 29.750','+4.6% this month','up'],['Low stock items','06','Needs attention','dn']].map(s=>`<div class="card stat"><div class="sub">${s[0]}</div><div class="v">${s[1]}</div><div class="${s[3]}">${s[2]}</div></div>`).join('')}</div>

<div class="card"><h3>Best selling products</h3><div class="sub">Based on units sold</div>${[['☕','Cappuccino',86],['🥤','Iced Aren Latte',72],['🖤','Americano',58],['🥐','Butter Croissant',41]].map(b=>`<div class="li"><div class="ic">${b[0]}</div><div><b>${b[1]}</b><div class="sub">${b[2]} sold</div></div></div>`).join('')}</div></div>
<div class="row2"><div class="card"><div style="display:flex;justify-content:space-between"><h3>Recent transactions</h3><b>View all →</b></div><div class="tw"><table><tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Payment</th><th>Total</th></tr>${[['0248','Juve R.','QRIS','78.100'],['0247','Alya Putri','Cash','53.000'],['0246','Dimas A.','Debit','42.500']].map(t=>`<tr><td><b>#CF-${t[0]}</b></td><td>${t[1]}</td><td>02 Nov 2026</td><td>${t[2]}</td><td><b>Rp ${t[3]}</b></td></tr>`).join('')}</table></div></div>
<div class="card alert"><h3>Inventory alert</h3><div class="sub">Items running low</div>${[['Fresh milk','2 packs left'],['Coffee beans','1.5 kg left'],['Caramel syrup','1 bottle left']].map(a=>`<div class="li"><span>● ${a[0]}</span><span>${a[1]}</span></div>`).join('')}</div></div>`;
return `<div class="app">${side('m',[['overview','▦ Overview'],['s','▣ Sales reports'],['p','◷ Products'],['i','▤ Inventory'],['e','⚙ Employees']],S.mp,'mgo','MANAGER')}<main class="main">${h}</main></div>`}
function mgo(k){S.mp=k;if(k!='overview')toast('Halaman ini belum tersedia di prototype');S.mp='overview';render()}
function render(keep){const r=document.getElementById('root');r.innerHTML=S.role=='customer'?customer():S.role=='kasir'?kasir():manajer();
document.getElementById('roles').innerHTML=[['customer','Customer'],['kasir','Kasir'],['manajer','Manajer']].map(x=>`<button class="${S.role==x[0]?'on':''}" onclick="S.role='${x[0]}';S.q='';S.mcat='All';render()">${x[1]}</button>`).join('');
if(keep){const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
render();
